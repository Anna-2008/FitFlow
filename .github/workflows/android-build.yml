name: Construir APK Android (Capacitor)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK de Depuração
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Gerar build web
        run: npm run build
      - name: Gerar assets Android
        run: npx capacitor-assets generate --android
      - name: Adicionar plataforma Android se necessário
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Permissão do Gradle
        run: chmod +x android/gradlew
      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
